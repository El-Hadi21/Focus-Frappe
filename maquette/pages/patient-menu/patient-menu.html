<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu du profil | Focus &amp; Frappe</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="patient-menu.css" />
    <script src="../../mock-back/mock-api.js"></script>
  </head>
  <body>
    <main class="patient-menu-page">
      <div class="card patient-menu-card">
        <header class="patient-menu-header">
          <button type="button" class="btn-secondary" onclick="window.location.href='../dashboard/dashboard.html'">Retour</button>
          <div class="patient-avatar" id="patient-avatar" aria-hidden="true"></div>
          <h1 id="patient-name-age"></h1>
        </header>

        <nav class="patient-menu-actions" aria-label="Actions du profil">
          <button type="button" class="btn-primary" onclick="window.location.href='../theme-selection/theme-selection.html'">Jouer</button>
          <button type="button" class="btn-secondary" onclick="window.location.href='../configuration/configuration.html'">Configurer la séance</button>
          <button type="button" class="btn-secondary" onclick="window.location.href='../stats/stats.html'">Statistiques</button>
          <button type="button" class="btn-danger" id="btn-delete-profile">Supprimer le profil</button>
        </nav>
      </div>
    </main>
    <script src="patient-menu.js"></script>
  </body>
</html>
