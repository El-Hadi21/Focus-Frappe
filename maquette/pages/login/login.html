<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion | Focus &amp; Frappe</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card card" aria-labelledby="login-title">
        <div class="login-header">
          <h1 id="login-title">Bienvenue</h1>
          <p>Connectez-vous à votre espace professionnel.</p>
        </div>

        <form class="login-form" id="login-form">
          <div class="form-field">
            <label for="email">Adresse e-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="vous@exemple.fr"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Mot de passe</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Votre mot de passe"
              required
            />
          </div>

          <button class="btn-primary login-submit" id="login-button" type="button">
            Se connecter
          </button>
        </form>
      </section>
    </main>

    <script>
      document.getElementById("login-button").addEventListener("click", function () {
        window.location.href = "../dashboard/dashboard.html";
      });
    </script>
  </body>
</html>
