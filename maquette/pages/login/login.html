<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion | Focus &amp; Frappe</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card card" aria-labelledby="login-title">
        <h1 id="login-title">Focus &amp; Frappe - Espace Praticien</h1>
        <form id="login-form" class="login-form">
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required />
          </div>

          <div class="form-field">
            <label for="password">Mot de passe</label>
            <input id="password" name="password" type="password" required />
          </div>

          <button type="submit" class="btn-primary login-submit">Se connecter</button>
        </form>
      </section>
    </main>

    <script>
      document.getElementById('login-form').addEventListener('submit', (event) => {
        event.preventDefault();
        window.location.href = '../dashboard/dashboard.html';
      });
    </script>
  </body>
</html>
