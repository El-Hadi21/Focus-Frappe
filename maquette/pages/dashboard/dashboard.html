<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord | Focus &amp; Frappe</title>
    <link rel="stylesheet" href="../../styles/global.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <script src="../../mock-back/mock-api.js"></script>
  </head>
  <body>
    <main class="dashboard-page">
      <header class="dashboard-header">
        <div>
          <h1>Mes patients</h1>
          <p class="dashboard-intro">Sélectionnez un patient pour accéder à son suivi.</p>
        </div>
        <div class="dashboard-actions">
          <span class="patient-count">0 patients</span>
          <button id="btn-logout" class="btn-danger" type="button">Déconnexion</button>
        </div>
      </header>

      <section class="patient-grid" aria-label="Liste des patients"></section>
    </main>

    <button class="floating-action" type="button" aria-label="Ajouter un patient" onclick="window.location.href='../create-profile/create-profile.html'">+</button>
    <script src="dashboard.js"></script>
  </body>
</html>
