name: focus-frappe

services:
  back:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8081:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../backend/database/:/app/database/:rw

  front:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: docker
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      back:
        condition: service_healthy