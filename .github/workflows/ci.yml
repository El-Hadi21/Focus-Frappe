name: Focus & Frappe CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
      - 'feat/**'

jobs:
  frontend-ci:
    name: Front-end Angular (Build & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Installation des dépendances Front-end
        run: npm ci

      - name: Compilation TypeScript & Build Production Angular
        run: npm run build

  backend-ci:
    name: Back-end Node.js (Build TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérification de la présence du dossier backend
        id: check_backend
        run: |
          if [ -f "./backend/package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Configuration de Node.js 20
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation et Build du Back-end
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: ./backend
        run: |
          npm install
          npm run build